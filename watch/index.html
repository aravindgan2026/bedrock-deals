<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Bedrock</title>
<link rel="icon" href="/favicon-32.png">
<style>
:root{--bg:#FBF6EF;--fg:#1A120C;--soft:#6B5D52;--accent:#FF4D00;--line:#ECE3D9;--card:#FFFFFF;--hot:#FFF1E8;--ok:#127A3E}
@media (prefers-color-scheme: dark){:root{--bg:#17110C;--fg:#F6EEE6;--soft:#B9AA9C;--accent:#FF6A26;--line:#3A2E25;--card:#221A14;--hot:#2E1C10;--ok:#5BD08A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;padding:20px 16px 40px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:6px 0 0}
p{margin:0;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.hot{background:var(--hot);border-color:var(--accent)}
.who{font-weight:700;font-size:17px;word-break:break-word}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--soft);margin-left:6px}
.big{font-size:15px;color:var(--fg)}
.ok{color:var(--ok);font-weight:700}
.note{font-size:13px}
#err{color:#B42318;font-weight:700}
form{display:flex;gap:8px}form[hidden]{display:none}input{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
details{margin-top:4px}summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px}.tl{margin:6px 0 0;padding:0;list-style:none;font-size:13px;color:var(--soft)}.tl li{padding:3px 0;border-top:1px solid var(--line)}.tl b{color:var(--fg)}a{color:var(--accent)}#lock{max-width:340px;margin:18vh auto 0;display:flex;flex-direction:column;gap:12px}#lock form{flex-direction:column}#app[hidden],#lock[hidden]{display:none}
button{font:inherit;font-weight:700;padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff}
</style>
</head>
<body>
<main id="lock" hidden>
  <h1>Bedrock</h1>
  <form id="kf"><input id="ki" type="password" placeholder="Password" autocomplete="current-password"><button>Open</button></form>
  <p id="err"></p>
</main>
<main id="app" hidden>
  <h1>Who looked at Winter Park</h1>
  <p id="upd">Loading…</p>
  <p class="note">Updates by itself every minute. Taps from our own team's phones and computers are taken out. A link can be forwarded, so "Srinivas" means "someone with Srinivas's link".</p>
  <p id="err2"></p>
  <section id="snf"></section>
  <section id="holds"></section>
  <section id="all"></section>
  <section id="ph"></section>
  <p class="note"><a href="#" id="out">Lock this page on this phone</a></p>
</main>
<script>
(function(){
  var F='https://dtybhuhcuqybjipnfgcg.supabase.co/functions/v1/sussex-watch', K='';
  function $(i){return document.getElementById(i)}
  try{var m=location.hash.match(/k=([^&]+)/); if(m){K=decodeURIComponent(m[1]); localStorage.setItem('watch_k',K); history.replaceState(null,'',location.pathname)} else K=localStorage.getItem('watch_k')||''}catch(x){}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function t(ts){if(!ts)return'';var d=new Date(ts);return d.toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'})+' ET'}
  function ago(ts){var m=Math.round((Date.now()-new Date(ts))/60000);var h=Math.round(m/60),d=Math.round(m/1440);return m<60?m+' min ago':m<1440?h+(h==1?' hour ago':' hours ago'):d+(d==1?' day ago':' days ago')}
  function name(p){var w=p.who;if(p.friendOf)return 'A friend of '+p.friendOf.split('@')[0];if(w.indexOf('(general')>-1)return w.split(' (')[0]+' (no-name link)';return w}
  function N(x){return Number(x)||0}
  function money(a){return a.map(function(x){return '$'+N(x)+'K'}).join(', ')}
  function draw(d){
    $('upd').textContent='Last updated '+t(d.at)+'. '+d.teamEventsRemoved+' taps from our own team taken out.';
    var snf=d.people.filter(function(p){return p.startedNotFinished});
    $('snf').innerHTML='<h2>Started to hold a spot, didn\'t finish ('+snf.length+')</h2>'+(snf.length?snf.map(function(p){
      return '<div class="card hot"><div class="who">'+esc(name(p))+'<span class="tag">'+esc(p.tier)+' link</span></div>'+
      '<div class="big">Pressed Invest '+esc(t(p.lastInvest))+' ('+ago(p.lastInvest)+'). Did not fill in the form.</div>'+
      (p.amounts.length?'<div>Looked at amounts: '+esc(money(p.amounts))+'</div>':'')+
      '<div>'+N(p.views)+(p.views==1?' visit on ':' visits on ')+N(p.devices)+' device'+(p.devices==1?'':'s')+(p.video?', watched the video':'')+'</div></div>'}).join(''):'<p>Nobody right now.</p>');
    $('holds').innerHTML='<h2>Spots held ('+d.holds.length+')</h2>'+(d.holds.length?d.holds.map(function(h){
      return '<div class="card"><div class="who">'+esc(h.name)+' <span class="ok">$'+Number(h.amount).toLocaleString()+'</span></div><div>'+esc(t(h.at))+(h.source==='preview'?' · from the test site':h.source&&h.source.indexOf('p:')===0?' · from partner page '+esc(h.source.slice(2)):'')+'</div></div>'}).join(''):'<p>None yet.</p>');
    $('all').innerHTML='<h2>Everyone who looked ('+d.people.length+')</h2>'+d.people.map(function(p){
      return '<div class="card"><div class="who">'+esc(name(p))+'<span class="tag">'+esc(p.tier)+' link</span></div>'+
      '<div>'+N(p.views)+(p.views==1?' visit on ':' visits on ')+N(p.devices)+' device'+(p.devices==1?'':'s')+' · read it '+N(p.reads)+'x'+(p.video?' · video '+N(p.video)+'x':'')+(p.back?' · came back '+N(p.back)+'x':'')+'</div>'+
      (p.amounts.length?'<div>Looked at amounts: '+esc(money(p.amounts))+'</div>':'')+
      (p.investTaps?'<div>Pressed Invest '+N(p.investTaps)+'x</div>':'')+(p.talkTaps?'<div>Tapped "talk to us" '+N(p.talkTaps)+'x</div>':'')+
      '<div class="note">First seen '+esc(t(p.first))+' · last visit '+esc(t(p.last))+'</div>'+
      (p.deviceList&&p.deviceList.length?'<div class="note">Devices: '+esc(p.deviceList.join(' · '))+'</div>':'')+
      (p.timeline&&p.timeline.length?'<details><summary>Every tap ('+p.timeline.length+(p.timeline.length>=40?' latest':'')+')</summary><ul class="tl">'+p.timeline.map(function(v){return '<li><b>'+esc(t(v.at))+'</b> · '+esc(v.what)+' · '+esc(v.device)+'</li>'}).join('')+'</ul></details>':'')+
      '</div>'}).join('');
    drawPh(d.ph);
  }
  function mins(s){s=N(s);return s<60?s+' sec':Math.round(s/60)+' min'}
  function drawPh(ph){
    var h='<h2>Partner pages and the open sign-up (PostHog)</h2>';
    if(!ph||!ph.ok){$('ph').innerHTML=h+'<p>PostHog did not answer'+(ph&&ph.why?' ('+esc(ph.why)+')':'')+'. The rest of the page is fine.</p>';return}
    h+='<p class="note">These come from the partner pages and the join page. The investor links themselves do not report to PostHog, so their detail is in the cards above.</p>';
    h+='<h2>By link</h2>'+ph.links.slice(0,20).map(function(l){return '<div class="card"><div class="who">'+esc(l.who)+(l.page?'<span class="tag">'+esc(l.page)+'</span>':'')+'</div><div>'+N(l.views)+' page views · '+N(l.taps)+' taps · '+N(l.sessions)+' visits · '+N(l.devices)+' device'+(l.devices==1?'':'s')+'</div><div class="note">Last seen '+esc(t(l.last))+'</div></div>'}).join('');
    h+='<h2>Latest visits</h2>'+ph.sessions.slice(0,25).map(function(x){return '<div class="card"><div class="who">'+esc(x.who)+'</div><div>'+esc(t(x.first))+' · stayed '+mins(x.secs)+' · '+N(x.views)+' pages · '+N(x.taps)+' taps</div><div class="note">'+esc([x.device,x.browser,x.city,x.state].filter(Boolean).join(' · '))+' · <a href="'+esc(x.replay)+'" target="_blank" rel="noopener noreferrer">watch replay</a></div></div>'}).join('');
    $('ph').innerHTML=h;
  }
  function lock(msg){$('app').hidden=true;$('lock').hidden=false;$('err').textContent=msg||''}
  function load(){
    if(!K){lock();return}
    fetch(F,{headers:{'x-watch-key':K},cache:'no-store'}).then(function(r){if(r.status===404){K='';try{localStorage.removeItem('watch_k')}catch(x){};lock('Wrong password.');return null}return r.json()})
      .then(function(d){if(!d)return;if(!d.ok){$('err2').textContent='Could not load: '+(d.why||'error');return}$('err2').textContent='';$('lock').hidden=true;$('app').hidden=false;draw(d)})
      .catch(function(){$('err2').textContent='Could not reach the server. Trying again in a minute.'});
  }
  $('kf').addEventListener('submit',function(e){e.preventDefault();K=$('ki').value.trim();try{localStorage.setItem('watch_k',K)}catch(x){};load()});
  $('out').addEventListener('click',function(e){e.preventDefault();K='';try{localStorage.removeItem('watch_k')}catch(x){};lock('Locked.')});
  load(); setInterval(load,60000);
})();
</script>
</body>
</html>
